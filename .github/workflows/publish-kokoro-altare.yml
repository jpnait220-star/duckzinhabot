name: Publicar Kokoro para Altare

on:
  workflow_dispatch:
  push:
    branches: [asasa]
    paths:
      - "kokoro-altare/Dockerfile"
      - ".github/workflows/publish-kokoro-altare.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar e publicar imagem CPU
        uses: docker/build-push-action@v6
        with:
          context: ./kokoro-altare
          push: true
          platforms: linux/amd64
          tags: ghcr.io/jpnait220-star/duckzinha-kokoro-altare:latest
          labels: |
            org.opencontainers.image.source=https://github.com/jpnait220-star/duckzinhabot
            org.opencontainers.image.description=Kokoro FastAPI CPU na porta 25715 para Altare
